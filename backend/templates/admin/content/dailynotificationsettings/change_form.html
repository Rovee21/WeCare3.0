{% extends "admin/change_form.html" %}
{% block object-tools-items %}
  {{ block.super }}
  {% if original %}
  <li>
    <a href="{{ reset_last_sent_url }}" class="historylink"
       style="background:#B45309;color:#fff;padding:6px 14px;border-radius:4px;text-decoration:none;font-size:13px;"
       onclick="return confirm('This clears today\'s \'already sent\' flag so the daily notification can send again today — it does NOT send anything itself. Continue?');">
      ⟳ Allow Resend Today
    </a>
  </li>
  {% endif %}
{% endblock %}
